<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked — EGO TV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#FF1A1A;--black:#000;--white:#f5f5f0;--gray:#888;--mono:'Space Mono',monospace;--display:'Bebas Neue',sans-serif;}
body{background:var(--black);color:var(--white);font-family:var(--mono);cursor:crosshair;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
::selection{background:var(--red);color:var(--black);}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:0.3;mix-blend-mode:overlay;}
.lock-wrap{position:relative;z-index:2;text-align:center;max-width:340px;padding:2rem;}
.lock-eyebrow{font-size:0.55rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--red);margin-bottom:1.25rem;display:flex;align-items:center;justify-content:center;gap:0.75rem;}
.lock-eyebrow::before,.lock-eyebrow::after{content:'';width:20px;height:1px;background:var(--red);}
.lock-title{font-family:var(--display);font-size:3rem;letter-spacing:0.03em;margin-bottom:1.5rem;line-height:1;}
input[type="password"]{width:100%;background:transparent;border:1px solid rgba(255,255,255,0.2);color:var(--white);font-family:var(--mono);font-size:0.75rem;letter-spacing:0.1em;padding:0.9rem 1rem;text-align:center;outline:none;transition:border-color 0.2s;}
input[type="password"]:focus{border-color:var(--red);}
.lock-btn{width:100%;margin-top:0.75rem;background:var(--red);color:var(--black);border:none;padding:0.9rem;font-family:var(--mono);font-size:0.62rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;cursor:crosshair;transition:background 0.2s;}
.lock-btn:hover{background:#ff3333;}
.lock-error{margin-top:1rem;font-size:0.6rem;letter-spacing:0.08em;color:var(--red);opacity:0;transition:opacity 0.2s;}
.lock-error.show{opacity:1;}
.lock-back{display:inline-block;margin-top:2.5rem;font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gray);text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:2px;}
.lock-back:hover{color:var(--red);}
</style>
</head>
<body>
<div class="lock-wrap">
  <div class="lock-eyebrow">Private</div>
  <h1 class="lock-title">Locked</h1>
  <form id="lockForm">
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off" required>
    <button type="submit" class="lock-btn">Unlock</button>
  </form>
  <div class="lock-error" id="lockError">Wrong password</div>
  <a href="/" class="lock-back">← Back to site</a>
</div>
<script>
const form = document.getElementById('lockForm');
const errorEl = document.getElementById('lockError');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');

  const password = document.getElementById('passwordInput').value;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });

    const data = await res.json();

    if (data.ok) {
      window.location.href = '/notes.html';
    } else {
      errorEl.classList.add('show');
    }
  } catch (err) {
    errorEl.textContent = 'Something went wrong. Try again.';
    errorEl.classList.add('show');
  }
});
</script>
</body>
</html>
